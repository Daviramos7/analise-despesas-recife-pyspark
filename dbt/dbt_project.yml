name: orcamento_recife
version: "0.2.0"
config-version: 2
profile: orcamento_recife

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

models:
  orcamento_recife:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Estatísticas atualizadas logo após criar cada tabela (boa prática para os joins
      # seguintes). A causa do timeout no Supabase era outra: a raw sem ANALYZE após a carga
      # (corrigido em src/orcamento/carga.py).
      +post-hook: "analyze {{ this }}"
