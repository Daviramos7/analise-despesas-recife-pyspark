services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: despesas
      POSTGRES_USER: despesas
      POSTGRES_PASSWORD: despesas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despesas -d despesas"]
      interval: 3s
      timeout: 3s
      retries: 20

  pipeline:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: despesas
      PGUSER: despesas
      PGPASSWORD: despesas
    volumes:
      - ./data:/app/data

  tests:
    build: .
    profiles: ["tests"]
    command: ["python", "-m", "pytest", "-q"]

volumes:
  pgdata:
