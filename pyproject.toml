[project]
name = "despesas-recife"
version = "0.2.0"
description = "Pipeline de dados das despesas orçamentárias do Recife: bruto -> limpo -> modelo dimensional"
requires-python = ">=3.10,<3.12"
dependencies = ["pyspark==3.5.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
